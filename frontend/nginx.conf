# nginx config for the frontend container (service 1).
# Listens on 8080 so the container runs as a non-root user (Pod Security "restricted").
# The Ingress sends /api to the api-gateway; this server only serves static files.

# Hide the nginx version in error pages and headers.
server_tokens off;

# Log JSON to stdout so Alloy/Loki parse it like the other services' logs.
log_format json escape=json '{"time":"$time_iso8601","service":"frontend","level":"info","msg":"request",'
  '"method":"$request_method","path":"$uri","status":$status,"bytes":$body_bytes_sent,'
  '"ms":$request_time,"requestId":"$http_x_request_id","ua":"$http_user_agent"}';

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    access_log /dev/stdout json;

    # Security headers on every response (add_header in a location replaces these, so they are repeated there).
    set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https: data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Liveness/readiness probe target.
    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"frontend"}';
    }

    # Connection counters, read by the nginx-prometheus-exporter sidecar on :9113.
    location = /stub_status {
        stub_status;
        access_log off;
        allow 127.0.0.1;
        deny all;
    }

    # config.js is replaced per environment by a ConfigMap, so it is never cached.
    location = /config.js {
        add_header Cache-Control "no-store";
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
    }

    # The app shell must be revalidated so a new release is picked up straight away.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # Static assets: cached for an hour, revalidated after (file names are not hashed).
    location ~* \.(css|js|svg|png|jpg|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

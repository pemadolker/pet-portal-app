# Local development stack: the 15 services plus PostgreSQL, Redis, etcd and Mailpit.
# This is for developing and for CI. The real deployment is Kubernetes (pet-portal-config).
#
#   ./local/setup.sh            # once: generates passwords and the JWT key pair into local/.secrets/
#   docker compose -f local/docker-compose.yml --env-file local/.secrets/.env up --build
#
# Website: http://localhost:8000   Mail inbox: http://localhost:8025
name: pet-portal

x-node: &node
  build: { context: .., dockerfile: Dockerfile }
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  environment: &node-env
    DEPLOY_ENV: local
    LOG_LEVEL: info
    REDIS_URL: redis://redis:6379
    ETCD_ENDPOINTS: http://etcd:2379
    PGHOST: postgres
    PGDATABASE: petportal
    SHUTDOWN_DELAY_MS: "1000"
    NODE_OPTIONS: --max-old-space-size=96
  volumes:
    - ./.secrets:/run/secrets:ro

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: petportal
    command: ["postgres", "-c", "max_connections=300"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "postgres"], interval: 3s, retries: 20 }

  db-bootstrap:
    image: postgres:16-alpine
    env_file: .secrets/.env
    environment: { PGHOST: postgres, PGUSER: postgres, PGPASSWORD: "${POSTGRES_PASSWORD}", PGDATABASE: petportal }
    volumes: [../db/bootstrap.sh:/bootstrap.sh:ro]
    entrypoint: ["sh", "/bootstrap.sh"]
    depends_on: { postgres: { condition: service_healthy } }

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 3s, retries: 20 }

  etcd:
    image: quay.io/coreos/etcd:v3.5.17
    command: ["etcd", "--name=etcd0", "--data-dir=/etcd-data", "--listen-client-urls=http://0.0.0.0:2379", "--advertise-client-urls=http://etcd:2379"]

  mailpit:
    image: axllent/mailpit:v1.21
    ports: ["8025:8025"]

  frontend:
    build: { context: ../frontend }
    restart: unless-stopped
    volumes: [./frontend-config.js:/usr/share/nginx/html/config.js:ro]

  edge:
    # Plays the part of the Ingress: / to frontend, /api to api-gateway.
    image: nginx:1.27-alpine
    ports: ["8000:80"]
    volumes: [./edge.conf:/etc/nginx/conf.d/default.conf:ro]
    depends_on: [frontend, api-gateway]

  signup:
    <<: *node
    build: { context: .., dockerfile: Dockerfile, args: { SERVICE: signup } }
    image: pet-portal/signup:local
    entrypoint: ["sh", "-c", "node /app/libs/common/migrate.js && exec node --require /app/libs/common/tracing.js /app/service/src/server.js"]
    environment:
      <<: *node-env
      SERVICE_NAME: signup
      POD_NAME: signup
      POD_IP: signup   # registry entry points at the compose service name
      DB_SCHEMA: signup
      PGUSER: svc_signup
      PGPASSWORD: ${SIGNUP_DB_PASSWORD}
      BOOTSTRAP_ADMIN_EMAIL: "${ADMIN_EMAIL}"
      BOOTSTRAP_ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
    depends_on:
      db-bootstrap: { condition: service_completed_successfully }
      etcd: { condition: service_started }

  login:
    <<: *node
    build: { context: .., dockerfile: Dockerfile, args: { SERVICE: login } }
    image: pet-portal/login:local
    entrypoint: ["sh", "-c", "node /app/libs/common/migrate.js && exec node --require /app/libs/common/tracing.js /app/service/src/server.js"]
    environment:
      <<: *node-env
      SERVICE_NAME: login
      POD_NAME: login
      POD_IP: login   # registry entry points at the compose service name
      DB_SCHEMA: login
      PGUSER: svc_login
      PGPASSWORD: ${LOGIN_DB_PASSWORD}
      JWT_PRIVATE_KEY_FILE: "/run/secrets/jwt-private.pem"
    depends_on:
      db-bootstrap: { condition: service_completed_successfully }
      etcd: { condition: service_started }

  profile:

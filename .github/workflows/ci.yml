# CI for the application (proposal section 7, "GitOps with Argo CD"):
#   test      unit tests, then the whole stack in docker compose: the 12-step journey
#             test and a 300-user one-winner race must pass
#   build     one image per service, tagged with the commit hash, scanned with Trivy,
#             pushed to GitHub Container Registry
#   deploy    writes the new tag into pet-portal-config (apps/*/values-dev.yaml);
#             Argo CD sees the commit and syncs dev. CI never touches the cluster.
name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
  packages: write
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}/pet-portal

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Syntax check
        run: for f in libs/common/*.js services/*/src/*.js; do node --check "$f"; done
      - name: Unit tests
        run: npm test
      - name: Start the stack (docker compose)
        run: |
          ./local/setup.sh
          docker compose -f local/docker-compose.yml --env-file local/.secrets/.env up -d --build
          for i in $(seq 1 60); do
            curl -sf http://localhost:8000/api/shelters >/dev/null && curl -sf http://localhost:8000/api/search >/dev/null && break
            sleep 5
          done
          curl -sf http://localhost:8000/api/shelters
      - name: Journey test (12 checks through the gateway)
        run: |
          set -a; . local/.secrets/.env; set +a
          BASE_URL=http://localhost:8000/api MAILPIT_URL=http://localhost:8025 npm run test:integration
      - name: One-winner race (300 adopters, 10 pets)
        run: |
          set -a; . local/.secrets/.env; set +a
          # the etcd image has no shell, so call etcdctl directly
          dc="docker compose -f local/docker-compose.yml --env-file local/.secrets/.env"
          $dc exec -T etcd etcdctl put /pet-portal/local/config/gateway/auth_rate_limit_per_minute 100000
          $dc exec -T etcd etcdctl put /pet-portal/local/config/gateway/rate_limit_per_minute 100000
          sleep 2
          node tests/load/one-winner.mjs --base http://localhost:8000/api --users 300 --pets 10 --admin-email "$ADMIN_EMAIL" --admin-password "$ADMIN_PASSWORD"
      - name: Logs on failure
        if: failure()
        run: docker compose -f local/docker-compose.yml --env-file local/.secrets/.env logs --tail=80

  build:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false      # one failing image does not cancel the other 14
      matrix:
        service: [frontend, api-gateway, signup, login, profile, pet, search, shelter, favorites, adoption, review, history, notification, email-worker, reporting]
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service == 'frontend' && 'frontend' || '.' }}
          build-args: |
            SERVICE=${{ matrix.service }}
            VERSION=${{ steps.tag.outputs.tag }}
          tags: ${{ env.REGISTRY }}/${{ matrix.service }}:${{ steps.tag.outputs.tag }}
          load: true
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Scan (fail on fixable critical vulnerabilities)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25   # v0.36.0, pinned by commit (older tags were hijacked in March 2026)
        with:
          image-ref: ${{ env.REGISTRY }}/${{ matrix.service }}:${{ steps.tag.outputs.tag }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Push
        run: docker push ${{ env.REGISTRY }}/${{ matrix.service }}:${{ steps.tag.outputs.tag }}

  deploy-dev:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/pet-portal-config
          token: ${{ secrets.CONFIG_REPO_TOKEN }}     # fine-grained token: contents read/write on pet-portal-config only
      - name: Write the new tag for dev
        run: |
          scripts/set-image-tag.sh dev "${GITHUB_SHA::7}" --all
          git config user.name "pet-portal-ci"
          git config user.email "ci@users.noreply.github.com"
          git commit -am "dev: deploy ${GITHUB_SHA::7} (${{ github.event.head_commit.message }})" || exit 0
          git push